name: rss Debian13 rss_venv

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        apt update
        apt install -y python3 python3-venv python3-dev python3-pip \
          gcc libc6-dev libffi-dev libssl-dev cargo wget

    - name: Create venv and install packages
      run: |
        python3 -m venv --copies rss_venv
        . rss_venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt --break-system-packages

    - name: Clean up unused files
      run: |
        rm -rf rss_venv/lib/python3.*/site-packages/pip
        rm -rf rss_venv/lib/python3.*/site-packages/setuptools
        find rss_venv -type d -name "__pycache__" -exec rm -rf {} +

    - name: Debug size
      run: |
        echo "=== venv size ==="
        du -sh rss_venv
        echo "=== file count ==="
        find rss_venv | wc -l

    - name: Package
      run: tar -czf rss_venv_debian.tar.gz rss_venv

    - name: Publish to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: venv-debian-latest
        name: venv-debian-latest
        files: rss_venv_debian.tar.gz
        token: ${{ secrets.GITHUB_TOKEN }}
